services:
  # Development services
  postgres:
    image: pgvector/pgvector:pg16
    ports:
      - "8090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: skinaware
      POSTGRES_PASSWORD: "AtmskbXCzhs_FUWCWkaKAkC_PDvCo9nr"
    volumes:
      - skinaware_data:/var/lib/postgresql/data

  redis:
    image: redis:6.2.6
    ports:
      - "8091:6379"
    command: redis-server --requirepass "Ye6ahnH8azlIpWex1K28yuXPnzPjdlCB"
    environment:
      - REDIS_REPLICATION_MODE=master

  # Test services
  postgres_test:
    image: pgvector/pgvector:pg16
    ports:
      - "9090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: skinaware_test
      POSTGRES_PASSWORD: "k49ifVcTkuMviBnm4OSRWZkKP4XKjHNB"
    volumes:
      - skinaware_test_data:/var/lib/postgresql/data

  redis_test:
    image: redis:6.2.6
    ports:
      - "9091:6379"
    command: redis-server --requirepass "9RxLcF5bRK7d8c6mpK9GYzWFpOHADYsF"
    environment:
      - REDIS_REPLICATION_MODE=master

volumes:
  skinaware_data:
  skinaware_test_data:
