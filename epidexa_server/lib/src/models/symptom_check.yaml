class: SymptomCheck
table: symptom_check

fields:
  id: UuidValue?, defaultPersist=random_v7
  userId: UuidValue, relation(parent=app_user)
  skinType: SkinType
  symptoms: List<Symptom>
  affectedAreas: List<AffectedArea>
  duration: String
  severity: Severity
  notesKey: String
  encryptionKey: String
  createdAt: DateTime
